# framework 依赖锁清单 (TBOX-FW-DSN-CR-010 / REQ-005)
#
# 记录 framework 的 TARGET / HOST 第三方依赖：版本、来源、许可证、SHA-256、
# 架构与获取边界。供 BUILD dependencies/lock.yaml 引用与 ABI 校验使用。
#
# 责任划分（设计 §BD1）：
#   - framework 仓库：声明真实需求（本文件）+ CMake find_package 消费。
#   - BUILD 仓库：锁定、构建/获取并校验 TARGET 依赖（yaml-cpp recipe）。
#   - spdlog 由 framework 自包含（header-only），不进 BUILD lock（设计 §6.1）。

framework_version: 0.1.0
components:
  - framework-config
  - framework-store
  - framework-log
  - framework-ipc
  - framework-hash
  - framework-application

dependencies:
  # --- TARGET 依赖（参与 aarch64 链接） ---
  - name: yaml-cpp
    version: "0.8.0"
    source:
      url: "https://github.com/jbeder/yaml-cpp/archive/refs/tags/0.8.0.tar.gz"
      sha256: "fbe74bbdcee21d656715688706da3c8becfd946d92cd44705cc6098bb23b3a16"
    license: BSD-3-Clause
    boundary: TARGET
    architecture: aarch64
    linkage: static
    provided_by: BUILD (recipe -> TBOX_DEP_STAGING; BUILD lock.yaml)
    framework_components:
      - framework-config      # PUBLIC (config.h includes yaml-cpp/yaml.h)
      - framework-store       # PRIVATE (store_serializer)
      - framework-log         # PRIVATE (log_config_adapter)
      - framework-application # PUBLIC (application.h includes yaml-cpp/yaml.h)
    host_dev_note: "host 开发经系统/homebrew yaml-cpp (find_package); 不再使用 third_party 预编译库"

  - name: OpenSSL
    version: "1.1 (orin-r35.3.1 sysroot) / 3.x (host)"
    license: Apache-2.0
    boundary: TARGET
    architecture: aarch64
    linkage: shared (libcrypto)
    provided_by: orin-r35.3.1 sysroot (TARGET) / system (host)
    framework_components:
      - framework-application # PRIVATE (utils.cpp AES 解密; utils.h 不暴露 OpenSSL)
    cmake_target: OpenSSL::Crypto

  - name: pthread
    license: LGPL-2.1 (glibc)
    boundary: TARGET
    architecture: aarch64
    linkage: shared
    provided_by: orin-r35.3.1 sysroot (TARGET) / system (host)
    framework_components:
      - framework-store       # PRIVATE (file_lock, flush_policy)
      - framework-log         # PRIVATE (async_dispatcher, enricher, sinks)
      - framework-ipc         # PRIVATE (client/server threads)
      - framework-application # PRIVATE (execute thread)
    cmake_target: Threads::Threads

  # --- framework 自包含依赖（header-only，随 framework-sdk 安装） ---
  - name: spdlog
    version: "1.8.2"
    source: bundled (third_party/include/spdlog)
    license: MIT
    boundary: SELF-CONTAINED (header-only)
    architecture: n/a
    linkage: header-only
    provided_by: framework (随 framework-sdk 安装到 include/tbox-framework/spdlog)
    framework_components:
      - framework-log         # PUBLIC (log.h includes spdlog)
      - framework-application # PUBLIC (via log.h) + PRIVATE (utils.cpp)
    cmake_target: TBoxFramework::spdlog (INTERFACE)
    note: "不进 BUILD lock; 含 bundled fmt 7.1.3"

  - name: fmt
    version: "7.1.3"
    source: bundled (third_party/include/spdlog/fmt/bundled)
    license: MIT
    boundary: SELF-CONTAINED (header-only, via spdlog)
    architecture: n/a
    linkage: header-only
    provided_by: framework (经 spdlog 传递)
    note: "spdlog 自带 bundled fmt，无独立 fmt 依赖"

# --- HOST 测试工具（不进入 TARGET 链接） ---
host_only:
  - name: ctest
    purpose: 单元测试运行器
    boundary: HOST
  - name: yaml-cpp (host)
    purpose: host 开发构建 framework（TARGET yaml-cpp 由 BUILD 提供）
    boundary: HOST

# 依赖图（设计 §BD4）
dependency_graph:
  framework-hash: []
  framework-config: [yaml-cpp]
  framework-store: [yaml-cpp, pthread]
  framework-log: [spdlog, yaml-cpp, pthread]
  framework-ipc: [framework-log, pthread]
  framework-application: [framework-config, framework-log, yaml-cpp, spdlog, OpenSSL, pthread]
